<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Terminal con un programa corto en Python</title>
  <rect width="320" height="200" fill="#FFFFFF"/>
  <rect x="16" y="16" width="288" height="168" rx="8" fill="#F3F6F4" stroke="#1D3B8F" stroke-width="2.5"/>
  <line x1="16" y1="44" x2="304" y2="44" stroke="#1D3B8F" stroke-width="2"/>
  <circle cx="34" cy="30" r="5" fill="none" stroke="#1D3B8F" stroke-width="2"/>
  <circle cx="50" cy="30" r="5" fill="none" stroke="#1D3B8F" stroke-width="2"/>
  <circle cx="66" cy="30" r="5" fill="#F3E04A" stroke="#1D3B8F" stroke-width="2"/>
  <g font-family="ui-monospace, 'Cascadia Mono', Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#22272B">
    <text x="30" y="78"><tspan fill="#56616B">&gt;&gt;&gt;</tspan> nombre = 'David'</text>
    <text x="30" y="106"><tspan fill="#56616B">&gt;&gt;&gt;</tspan> print(f'Hola, {nombre}')</text>
    <text x="30" y="134" fill="#1D3B8F" font-weight="bold">Hola, David</text>
    <text x="30" y="162"><tspan fill="#56616B">&gt;&gt;&gt;</tspan></text>
  </g>
  <rect x="66" y="150" width="9" height="16" fill="#1D3B8F"/>
</svg>
