<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Cómo llega el navegador a la página publicada en OCI</title>
  <defs>
    <marker id="punta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#22272B"/>
    </marker>
  </defs>
  <rect width="760" height="320" fill="#FFFFFF"/>
  <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#22272B">

    <!-- Navegador -->
    <rect x="20" y="168" width="140" height="74" rx="8" fill="#F3F6F4" stroke="#1D3B8F" stroke-width="2.5"/>
    <text x="90" y="200" text-anchor="middle" font-size="16" font-weight="700">Tu navegador</text>
    <text x="90" y="222" text-anchor="middle" font-size="13" fill="#56616B">celular o computador</text>

    <!-- DuckDNS -->
    <rect x="196" y="30" width="176" height="78" rx="8" fill="#F3F6F4" stroke="#1D3B8F" stroke-width="2.5"/>
    <text x="284" y="62" text-anchor="middle" font-size="16" font-weight="700">DuckDNS</text>
    <text x="284" y="86" text-anchor="middle" font-size="13" fill="#56616B">subdominio → IP pública</text>

    <!-- Flecha 1: consulta DNS -->
    <path d="M90 168 C 90 110, 130 70, 192 69" fill="none" stroke="#22272B" stroke-width="2" marker-end="url(#punta)"/>
    <text x="40" y="120" font-size="13" font-weight="600">1. pregunta la IP</text>

    <!-- OCI -->
    <rect x="404" y="16" width="342" height="290" rx="10" fill="none" stroke="#56616B" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="420" y="40" font-size="14" font-weight="700" fill="#56616B">Oracle Cloud Infrastructure</text>

    <rect x="422" y="56" width="306" height="234" rx="8" fill="none" stroke="#1D3B8F" stroke-width="2"/>
    <text x="436" y="78" font-size="13" font-weight="600" fill="#1D3B8F">red-infraestructura (10.0.0.0/16)</text>

    <rect x="442" y="92" width="268" height="184" rx="6" fill="none" stroke="#1D3B8F" stroke-width="1.5"/>
    <text x="456" y="114" font-size="13" fill="#1D3B8F">subred-web (10.0.0.0/24), pública</text>

    <!-- VM -->
    <rect x="462" y="150" width="228" height="90" rx="6" fill="#FBF3B5" stroke="#1D3B8F" stroke-width="2.5"/>
    <text x="576" y="176" text-anchor="middle" font-size="16" font-weight="700">servidor-personal</text>
    <text x="576" y="198" text-anchor="middle" font-size="13">Oracle Linux 9 + Nginx</text>
    <text x="576" y="220" text-anchor="middle" font-size="13" fill="#56616B">firewalld: http abierto</text>

    <text x="456" y="264" font-size="12" fill="#56616B">lista de seguridad: TCP 22 y 80</text>

    <!-- Internet gateway -->
    <rect x="414" y="190" width="16" height="30" rx="3" fill="#F3E04A" stroke="#1D3B8F" stroke-width="2"/>

    <!-- Flecha 2: HTTP -->
    <line x1="160" y1="205" x2="458" y2="205" stroke="#22272B" stroke-width="2" marker-end="url(#punta)"/>
    <text x="178" y="196" font-size="13" font-weight="600">2. pide la página: HTTP, puerto 80</text>
    <text x="398" y="232" text-anchor="end" font-size="12" fill="#56616B">salida-internet</text>
  </g>
</svg>
